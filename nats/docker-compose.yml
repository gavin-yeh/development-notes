version: '3'

services:
  nats1:
    container_name: nats-streaming1
    image: nats-streaming:alpine3.12
    command: ["-c","cluster.config"]
    ports:
      - 4221:4221
      - 6221:6221
    volumes:
      - "./config/cluster1.config:/cluster.config"
    # network_mode: "host"

  nats2:
    container_name: nats-streaming2
    image: nats-streaming:alpine3.12
    command: ["-c","cluster.config"]
    ports:
      - 4222:4222
      - 6222:6222
    volumes:
      - "./config/cluster2.config:/cluster.config"
    # network_mode: "host"

  nats3:
    container_name: nats-streaming3
    image: nats-streaming:alpine3.12
    command: ["-c","cluster.config"]
    ports:
      - 4223:4223
      - 6223:6223
    volumes:
      - "./config/cluster3.config:/cluster.config"
    # network_mode: "host"


